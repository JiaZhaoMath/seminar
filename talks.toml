# Applied Mathematics Seminar — the single source of truth for the website.
#
# EVERYTHING IN THIS FILE IS PUBLIC: the repository is public on GitHub.
# Put only what may appear on the website here. Keep hosts, email threads,
# booking status and other private notes in your own files instead.
#
# After editing:  python3 build.py        (then check index.html in a browser)
#                 python3 -m unittest discover tests
#                 git add -A && git commit -m "Add talk" && git push
#
# A talk needs only `date`. Leave out any field that is not known yet, never
# write "TBA": the page shows only the fields that are present. A talk with a
# speaker but no title is shown as "Title TBA" automatically.
#
#   date      Friday of the talk (YYYY-MM-DD, no quotes)
#   speaker   name as the speaker writes it
#   affiliation, position, webpage
#   title
#   start/end "HH:MM", 24-hour, Central time. Default: the series slot below.
#   room      e.g. "GP 346". Left out when unknown (nothing is guessed).
#   note      short highlighted notice, e.g. a different time or room
#   abstract, bio   use '''…''' strings; separate paragraphs with a blank line;
#                   $x$ is shown in italics
#   reserved = true   slot is taken but the speaker is not public yet; the
#                     page shows "Reserved" and nothing else for that date

